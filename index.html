<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>///</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000000;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow-x: hidden;
            font-family: "Courier New", monospace;
            padding: 20px 10px;
        }

        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
        }

        .video-box {
            flex-shrink: 0;
            cursor: pointer;
        }

        .video-box video {
            width: 520px;
            max-width: 88vw;
            height: auto;
            border: 1px solid #1a1a1a;
            display: block;
        }

        .side-meme {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
            transition: transform 0.15s, opacity 0.15s;
            cursor: pointer;
        }

        .side-meme:active {
            transform: scale(0.95);
        }

        .side-meme img {
            width: 200px;
            height: auto;
            max-height: 260px;
            object-fit: cover;
            border: 1px solid #1a1a1a;
            background-color: #050505;
            display: block;
        }

        @media (max-width: 850px) {
            .stage {
                flex-direction: column;
                gap: 16px;
            }

            .video-box video {
                width: 90vw;
            }

            .side-meme img {
                width: 130px;
                max-height: 160px;
            }
        }

        .counter-container {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #555555;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .odometer {
            background-color: #080808;
            color: #ff2222;
            padding: 5px 12px;
            border: 1px solid #222222;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(255, 34, 34, 0.4);
        }

        .inbox-card {
            margin-top: 24px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .inbox-textarea {
            width: 100%;
            height: 60px;
            background: #080808;
            border: 1px solid #222222;
            color: #ffffff;
            font-family: "Courier New", monospace;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            resize: none;
            user-select: text;
        }

        .inbox-textarea:focus {
            border-color: #ff2222;
        }

        .inbox-btn {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #ff3333;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .inbox-btn:active {
            background: #ff2222;
            color: #000;
        }

        #status-bar {
            color: #777;
            font-size: 10px;
            letter-spacing: 1px;
            min-height: 14px;
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- Левый мем с двойным триггером вибрации -->
        <div class="side-meme" onclick="handleTap('heavy')">
            <img src="chudjak.jpg" alt="">
        </div>

        <div class="video-box" onclick="handleTap('medium')">
            <video autoplay loop muted playsinline>
                <source src="wendigo.mp4" type="video/mp4">
            </video>
        </div>

        <div class="side-meme" onclick="handleTap('heavy')">
            <img src="meme2.jpg" alt="">
        </div>
    </div>

    <div class="counter-container">
        <span>VISITORS</span>
        <div class="odometer" id="visit-count">000000</div>
    </div>

    <!-- Форма отправки сообщений -->
    <div class="inbox-card">
        <textarea id="msg-input" class="inbox-textarea" placeholder="leave an anonymous transmission..."></textarea>
        <button id="send-btn" class="inbox-btn" onclick="sendMessage()">[ TRANSMIT ]</button>
        <div id="status-bar"></div>
    </div>

    <script>
        // ==========================================
        // ОБЯЗАТЕЛЬНО ВСТАВЬ СВОИ ДАННЫЕ В КАВЫЧКИ:
        const BOT_TOKEN = "8718527580:AAEuGSCNHVH33Yrqo_HXdJku7_AFbBci-rQ"; 
        const MY_CHAT_ID = "652140635";
        // ==========================================

        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
            } catch (e) {}
        }

        // Универсальная вибрация (TG API + HTML5 Vibration API)
        function handleTap(intensity = 'medium') {
            // 1. Пытаемся дёрнуть вибромотор через WebApp
            if (tg?.HapticFeedback) {
                try {
                    tg.HapticFeedback.impactOccurred(intensity);
                } catch (e) {}
            }
            // 2. Запасной нативный вибромотор Android/iOS браузеров
            if (navigator.vibrate) {
                navigator.vibrate(intensity === 'heavy' ? 45 : 25);
            }
        }

        // Отправка сообщений в Telegram через Bot API
        async function notifyTelegram(text) {
            if (!BOT_TOKEN || BOT_TOKEN === "YOUR_BOT_TOKEN_HERE") {
                throw new Error("ТОКЕН_НЕ_УКАЗАН");
            }
            if (!MY_CHAT_ID || MY_CHAT_ID === "YOUR_PERSONAL_CHAT_ID_HERE") {
                throw new Error("CHAT_ID_НЕ_УКАЗАН");
            }

            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    chat_id: MY_CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            });

            const data = await response.json();
            if (!data.ok) {
                if (data.description.includes("chat not found") || data.description.includes("bot can't initiate")) {
                    throw new Error("НАЖМИ_/START_В_БОТЕ");
                }
                throw new Error(data.description);
            }
            return data;
        }

        // 1. Логгер гостей
        async function logGuest() {
            const user = tg?.initDataUnsafe?.user;
            const sessionLogged = sessionStorage.getItem('guest_logged');

            if (user && !sessionLogged) {
                const guestTag = user.username ? `@${user.username}` : "без ника";
                const guestName = [user.first_name, user.last_name].filter(Boolean).join(" ");
                const logText = `👁 <b>ГОСТЬ НА ПОРТАЛЕ</b>\nИмя: ${guestName}\nНик: ${guestTag}\nID: <code>${user.id}</code>`;

                try {
                    await notifyTelegram(logText);
                    sessionStorage.setItem('guest_logged', '1');
                } catch (e) {
                    console.log("Logger notice:", e.message);
                }
            }
        }
        logGuest();

        // 3. Отправка анонимного сообщения
        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const btn = document.getElementById('send-btn');
            const status = document.getElementById('status-bar');
            const message = input.value.trim();

            if (!message) {
                handleTap('heavy');
                status.innerText = ">> ВВЕДИ ТЕКСТ";
                status.style.color = "#ff4444";
                return;
            }

            handleTap('medium');
            btn.disabled = true;
            btn.innerText = "[ TRANSMITTING... ]";
            status.innerText = ">> ОТПРАВКА...";
            status.style.color = "#888";

            const user = tg?.initDataUnsafe?.user;
            const sender = user ? `@${user.username || user.first_name} (ID: ${user.id})` : "Аноним из браузера";
            const payload = `✉ <b>СООБЩЕНИЕ ИЗ ПОРТАЛА:</b>\n\n«${message}»\n\n<i>Отправитель: ${sender}</i>`;

            try {
                await notifyTelegram(payload);

                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                if (navigator.vibrate) navigator.vibrate([30, 50, 30]);

                input.value = "";
                btn.innerText = "[ TRANSMITTED ]";
                status.innerText = ">> УСПЕШНО ДОСТАВЛЕНО";
                status.style.color = "#22ff66";

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "[ TRANSMIT ]";
                    status.innerText = "";
                }, 3000);

            } catch (err) {
                btn.disabled = false;
                btn.innerText = "[ TRANSMIT ]";
                status.style.color = "#ff2222";
                
                if (err.message === "ТОКЕН_НЕ_УКАЗАН" || err.message === "CHAT_ID_НЕ_УКАЗАН") {
                    status.innerText = ">> ОШИБКА: НЕ ВПИСАН ТОКЕН ИЛИ ID В КОДЕ";
                } else if (err.message === "НАЖМИ_/START_В_БОТЕ") {
                    status.innerText = ">> ОШИБКА: ЗАЙДИ В БОТА И НАЖМИ /START";
                } else {
                    status.innerText = ">> ОШИБКА: " + err.message;
                }
            }
        }

        // Одометр
        const baseOffset = 1337;
        let visits = localStorage.getItem('site_visits');
        visits = visits ? parseInt(visits) + 1 : baseOffset;
        localStorage.setItem('site_visits', visits);
        document.getElementById('visit-count').innerText = String(visits).padStart(6, '0');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>///</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: "Courier New", monospace;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 12px;
        }

        /* Центровочный контейнер: блокирует сползание интерфейса на десктопе */
        .main-wrapper {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* === SKYRIM STEALTH HUD === */
        .skyrim-hud {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.5s ease, transform 0.5s ease;
            cursor: pointer;
        }

        .skyrim-hud.visible {
            opacity: 1;
            transform: scale(1);
        }

        .skyrim-eye-box {
            width: 110px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .skyrim-eye-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .lid-top, .lid-bottom {
            fill: none;
            stroke: #777777;
            stroke-width: 2.8;
            stroke-linecap: round;
            transform-origin: 50px 22px;
            transform: scaleY(0.06);
            transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1.2), stroke 0.4s ease;
        }

        .iris-group {
            transform-origin: 50px 22px;
            transform: scale(0.2);
            opacity: 0;
            transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.4s ease;
        }

        .eye-iris {
            fill: none;
            stroke: #b5b5b5;
            stroke-width: 2.8;
        }

        .eye-pupil-dot {
            fill: #b5b5b5;
        }

        .skyrim-hud.detected .lid-top,
        .skyrim-hud.detected .lid-bottom {
            transform: scaleY(1);
            stroke: #b5b5b5;
        }

        .skyrim-hud.detected .iris-group {
            transform: scale(1);
            opacity: 1;
        }

        .skyrim-text {
            margin-top: 6px;
            font-family: "Arial Narrow", "Futura Condensed", "Franklin Gothic Medium", sans-serif-condensed, sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #777777;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95);
            transition: color 0.4s ease;
        }

        .skyrim-hud.detected .skyrim-text {
            color: #b5b5b5;
        }

        /* === ЦЕНТРАЛЬНАЯ МЕДИА-СЦЕНА === */
        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .video-box {
            flex-shrink: 0;
            cursor: pointer;
        }

        .video-box video {
            width: 500px;
            max-width: 86vw;
            height: auto;
            border: 1px solid #1a1a1a;
            display: block;
            background: #000;
        }

        .side-meme {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
            transition: transform 0.15s, opacity 0.15s;
            cursor: pointer;
            flex-shrink: 0;
        }

        .side-meme:active {
            transform: scale(0.95);
        }

        .side-meme img {
            width: 190px;
            height: auto;
            max-height: 250px;
            object-fit: cover;
            border: 1px solid #1a1a1a;
            background-color: #050505;
            display: block;
        }

        @media (max-width: 850px) {
            .stage {
                flex-direction: column;
                gap: 16px;
            }

            .video-box video {
                width: 90vw;
            }

            .side-meme img {
                width: 140px;
                max-height: 170px;
            }
        }

        /* === СЧЕТЧИК ПОСЕТИТЕЛЕЙ === */
        .counter-container {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555555;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .odometer {
            background-color: #080808;
            color: #ff2222;
            padding: 5px 12px;
            border: 1px solid #222222;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(255, 34, 34, 0.4);
        }

        /* === БЛОК ОТПРАВКИ СООБЩЕНИЯ === */
        .inbox-card {
            margin-top: 22px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .inbox-textarea {
            width: 100%;
            height: 60px;
            background: #080808;
            border: 1px solid #222222;
            color: #ffffff;
            font-family: "Courier New", monospace;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            resize: none;
            user-select: text;
        }

        .inbox-textarea:focus {
            border-color: #ff2222;
        }

        .inbox-btn {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #ff3333;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .inbox-btn:active {
            background: #ff2222;
            color: #000;
        }

        #status-bar {
            color: #777;
            font-size: 10px;
            letter-spacing: 1px;
            min-height: 14px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- HUD ИЗ СКАЙРИМА -->
        <div class="skyrim-hud" id="skyrim-hud" onclick="replayStealth()">
            <div class="skyrim-eye-box">
                <svg class="skyrim-eye-svg" viewBox="0 0 100 44">
                    <defs>
                        <clipPath id="skyrim-clip">
                            <path d="M 6 22 C 28 2, 72 2, 94 22 C 72 42, 28 42, 6 22 Z" />
                        </clipPath>
                    </defs>
                    <g clip-path="url(#skyrim-clip)">
                        <g class="iris-group">
                            <circle class="eye-iris" cx="50" cy="22" r="11.5" />
                            <circle class="eye-pupil-dot" cx="50" cy="22" r="2.2" />
                        </g>
                    </g>
                    <path class="lid-top" d="M 6 22 C 28 2, 72 2, 94 22" />
                    <path class="lid-bottom" d="M 6 22 C 28 42, 72 42, 94 22" />
                </svg>
            </div>
            <div class="skyrim-text" id="skyrim-text">СКРЫТНОСТЬ</div>
        </div>

        <!-- ЦЕНТРАЛЬНАЯ МЕДИА-СЦЕНА -->
        <div class="stage">
            <div class="side-meme" onclick="handleTap('heavy')">
                <img src="chudjak.jpg" alt="">
            </div>

            <div class="video-box" onclick="handleTap('medium')">
                <video autoplay loop muted playsinline>
                    <source src="wendigo.mp4" type="video/mp4">
                </video>
            </div>

            <div class="side-meme" onclick="handleTap('heavy')">
                <img src="meme2.jpg" alt="">
            </div>
        </div>

        <!-- СЧЕТЧИК ПОСЕТИТЕЛЕЙ -->
        <div class="counter-container">
            <span>VISITORS</span>
            <div class="odometer" id="visit-count">000000</div>
        </div>

        <!-- ПОЛЕ ОТПРАВКИ -->
        <div class="inbox-card">
            <textarea id="msg-input" class="inbox-textarea" placeholder="leave an anonymous transmission..."></textarea>
            <button id="send-btn" class="inbox-btn" onclick="sendMessage()">[ TRANSMIT ]</button>
            <div id="status-bar"></div>
        </div>
    </div>

    <script>
        // 1. БЕЗОПАСНЫЙ СТАБ TELEGRAM WEBAPP
        window.Telegram = window.Telegram || {};
        if (!window.Telegram.WebApp) {
            window.Telegram.WebApp = {
                ready: function() {},
                expand: function() {},
                initDataUnsafe: {},
                HapticFeedback: {
                    impactOccurred: function() {},
                    notificationOccurred: function() {}
                }
            };
        }

        // Подгружаем внешний скрипт Telegram только при открытии внутри клиента Telegram
        if (window.TelegramWebviewProxy || window.TelegramGameProxy || location.hash.includes('tgWebAppData')) {
            const tgScript = document.createElement('script');
            tgScript.src = "https://telegram.org/js/telegram-web-app.js";
            tgScript.onload = () => {
                try {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                } catch (e) {}
            };
            document.head.appendChild(tgScript);
        }

        const tg = window.Telegram.WebApp;

        // ВСТАВЬ СВОЙ URL CLOUDFLARE WORKER:
        const WORKER_URL = "https://tg-notify.pryanik848.workers.dev/";

        // Безопасный вызов вибрации (не вызывает Intervention error)
        function handleTap(intensity = 'medium') {
            if (tg?.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred(intensity); } catch (e) {}
            }
            if (navigator.vibrate && navigator.userActivation?.hasBeenActive) {
                try { navigator.vibrate(intensity === 'heavy' ? 45 : 20); } catch (e) {}
            }
        }

        // Анимация глаза Skyrim
        function runStealthDetection() {
            const hud = document.getElementById('skyrim-hud');
            const label = document.getElementById('skyrim-text');
            if (!hud || !label) return;

            setTimeout(() => {
                hud.classList.add('visible');
            }, 250);

            setTimeout(() => {
                hud.classList.add('detected');
                label.innerText = "ВАС ЗАМЕТИЛИ";
                if (tg?.HapticFeedback) {
                    try { tg.HapticFeedback.impactOccurred('heavy'); } catch(e) {}
                }
            }, 1300);
        }

        function replayStealth() {
            const hud = document.getElementById('skyrim-hud');
            const label = document.getElementById('skyrim-text');
            if (!hud || !label) return;

            hud.classList.remove('detected');
            label.innerText = "СКРЫТНОСТЬ";
            handleTap('medium');

            setTimeout(() => {
                hud.classList.add('detected');
                label.innerText = "ВАС ЗАМЕТИЛИ";
                handleTap('heavy');
            }, 900);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runStealthDetection);
        } else {
            runStealthDetection();
        }

        // Отправка запросов в Cloudflare Worker
        async function sendToWorker(payload) {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok || data.ok === false) {
                throw new Error(data.description || data.error || "Ошибка сети");
            }
            return data;
        }

        // Логгер визита (срабатывает 1 раз за сессию)
        async function logVisit() {
            const alreadyLogged = sessionStorage.getItem('logged_entry');
            if (alreadyLogged) return;

            const user = tg?.initDataUnsafe?.user || null;
            try {
                await sendToWorker({
                    type: 'visit',
                    tg_user: user
                });
                sessionStorage.setItem('logged_entry', '1');
            } catch (e) {
                console.log("Visit error:", e);
            }
        }
        logVisit();

        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const btn = document.getElementById('send-btn');
            const status = document.getElementById('status-bar');
            const message = input.value.trim();

            if (!message) {
                handleTap('heavy');
                status.innerText = ">> ВВЕДИ ТЕКСТ";
                status.style.color = "#ff4444";
                return;
            }

            handleTap('medium');
            btn.disabled = true;
            btn.innerText = "[ TRANSMITTING... ]";
            status.innerText = ">> ОТПРАВКА...";
            status.style.color = "#888";

            const user = tg?.initDataUnsafe?.user || null;

            try {
                await sendToWorker({
                    type: 'message',
                    text: message,
                    tg_user: user
                });

                if (tg?.HapticFeedback) {
                    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                }

                input.value = "";
                btn.innerText = "[ TRANSMITTED ]";
                status.innerText = ">> УСПЕШНО ДОСТАВЛЕНО";
                status.style.color = "#22ff66";

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "[ TRANSMIT ]";
                    status.innerText = "";
                }, 3000);

            } catch (err) {
                btn.disabled = false;
                btn.innerText = "[ TRANSMIT ]";
                status.style.color = "#ff2222";
                status.innerText = ">> ОШИБКА: " + err.message;
            }
        }

        // Одометр
        const baseOffset = 1337;
        let visits = localStorage.getItem('site_visits');
        visits = visits ? parseInt(visits) + 1 : baseOffset;
        localStorage.setItem('site_visits', visits);
        document.getElementById('visit-count').innerText = String(visits).padStart(6, '0');

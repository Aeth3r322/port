<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>///</title>
    <!-- Официальный SDK Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: "Courier New", monospace;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px 110px 12px;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* === КИТЧЕВАЯ НАДПИСЬ НАД ВИДЕО (HAUNTED MOUND STYLE) === */
        .top-brand-label {
            font-size: 14px;
            font-weight: bold;
            color: #ff1111;
            text-transform: lowercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 
                0 0 2px #ff0000,
                0 0 4px #ff0000,
                0 0 8px #ff0000,
                0 0 12px #ff3333,
                0 0 20px #ff0000;
            font-family: "Courier New", monospace;
            animation: redGlowPulse 1.5s infinite alternate;
        }

        @keyframes redGlowPulse {
            from {
                text-shadow: 
                    0 0 2px #ff0000,
                    0 0 4px #ff0000,
                    0 0 8px #ff0000,
                    0 0 12px #ff3333;
            }
            to {
                text-shadow: 
                    0 0 3px #ff0000,
                    0 0 6px #ff0000,
                    0 0 12px #ff3333,
                    0 0 18px #ff0000,
                    0 0 24px #ff0000;
            }
        }

        
        /* === ЦЕНТРАЛЬНАЯ МЕДИА-СЦЕНА === */
        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .video-box {
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }

        .video-box video {
            width: 500px;
            max-width: 86vw;
            height: auto;
            border: 1px solid #1a1a1a;
            display: block;
            background: #000;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .video-box:hover video {
            border-color: #333333;
        }

        .side-meme {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
            transition: transform 0.15s, opacity 0.15s;
            cursor: pointer;
            flex-shrink: 0;
        }

        .side-meme:active {
            transform: scale(0.95);
        }

        .side-meme img {
            width: 190px;
            height: auto;
            max-height: 250px;
            object-fit: cover;
            border: 1px solid #1a1a1a;
            background-color: #050505;
            display: block;
        }

        @media (max-width: 850px) {
            .stage {
                flex-direction: column;
                gap: 16px;
            }

            .video-box video {
                width: 90vw;
            }

            .side-meme img {
                width: 140px;
                max-height: 170px;
            }
        }

        /* === СЧЕТЧИК ПОСЕТИТЕЛЕЙ === */
        .counter-container {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555555;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .odometer {
            background-color: #080808;
            color: #ff2222;
            padding: 5px 12px;
            border: 1px solid #222222;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(255, 34, 34, 0.4);
        }

        /* === БЛОК ОТПРАВКИ (СТРОГО АНОНИМНЫЙ) === */
        .inbox-card {
            margin-top: 22px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .inbox-textarea {
            width: 100%;
            height: 60px;
            background: #080808;
            border: 1px solid #222222;
            color: #ffffff;
            font-family: "Courier New", monospace;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            resize: none;
            user-select: text;
        }

        .inbox-textarea:focus {
            border-color: #ff2222;
        }

        .inbox-btn {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #ff3333;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .inbox-btn:active {
            background: #ff2222;
            color: #000;
        }

        #status-bar {
            color: #777;
            font-size: 10px;
            letter-spacing: 1px;
            min-height: 14px;
        }

        /* === ПОСТОЯННО ВИДИМЫЙ ПОЛЗУНОК ЗВУКА === */
        .sound-hud-panel {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 1;
            pointer-events: auto;
            z-index: 9999;

            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 10, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #262626;
            padding: 8px 18px;
            border-radius: 999px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 1px rgba(255, 255, 255, 0.15);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .sound-hud-panel.is-active-sound {
            border-color: #441111;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 34, 34, 0.18);
        }

        .sound-btn-toggle {
            background: transparent;
            border: none;
            color: #888888;
            font-family: "Courier New", monospace;
            font-size: 14px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.15s;
        }

        .sound-btn-toggle:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .sound-btn-toggle:active {
            transform: scale(0.92);
        }

        .sound-hud-panel.is-active-sound .sound-btn-toggle {
            color: #ff3333;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
        }

        .volume-slider-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 110px;
            height: 4px;
            border-radius: 2px;
            background: #252525;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid #000000;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
            transition: transform 0.15s, background-color 0.2s, box-shadow 0.2s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            background: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
        }

        .volume-slider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid #000000;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
            transition: transform 0.15s, background-color 0.2s, box-shadow 0.2s;
        }

        .volume-slider::-moz-range-thumb:hover {
            transform: scale(1.25);
            background: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
        }

        .sound-hud-panel.is-active-sound .volume-slider::-webkit-slider-thumb {
            background: #ff3333;
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.7);
        }

        .volume-val-label {
            font-size: 11px;
            letter-spacing: 1px;
            color: #666666;
            min-width: 36px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .sound-hud-panel.is-active-sound .volume-val-label {
            color: #ff3333;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
       
        <!-- НАДПИСЬ НАД ВИДЕО -->
        <div class="top-brand-label">chubzikпацык.xyz</div>

        <!-- МЕДИА-СЦЕНА -->
        <div class="stage">
            <div class="side-meme" onclick="handleTap('heavy')">
                <img src="chudjak.jpg" alt="" loading="lazy">
            </div>

            <div class="video-box" id="video-container" onclick="handleVideoClick()">
                <video id="main-video" autoplay loop muted playsinline preload="metadata">
                    <source src="wendigo.mp4" type="video/mp4">
                </video>
            </div>

            <div class="side-meme" onclick="handleTap('heavy')">
                <img src="meme2.jpg" alt="" loading="lazy">
            </div>
        </div>

        <!-- СЧЕТЧИК ПОСЕТИТЕЛЕЙ -->
        <div class="counter-container">
            <span>VISITORS</span>
            <div class="odometer" id="visit-count">000000</div>
        </div>

        <!-- ПОЛЕ ОТПРАВКИ -->
        <div class="inbox-card">
            <textarea id="msg-input" class="inbox-textarea" placeholder="leave an anonymous transmission..."></textarea>
            <button id="send-btn" class="inbox-btn" onclick="sendMessage()">[ TRANSMIT ]</button>
            <div id="status-bar"></div>
        </div>
    </div>

    <!-- СТАТИЧНАЯ ПАНЕЛЬ ЗВУКА СНИЗУ -->
    <div class="sound-hud-panel" id="sound-panel">
        <button class="sound-btn-toggle" id="sound-toggle-btn" onclick="toggleMute()" title="Вкл / Выкл звук">
            <span id="sound-icon">🔇</span>
        </button>

        <div class="volume-slider-box">
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
            <span class="volume-val-label" id="volume-val">80%</span>
        </div>
    </div>

    <audio id="separate-audio" loop src=""></audio>

    <script>
        // Инициализация WebApp
        var tgApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tgApp) {
            try {
                tgApp.ready();
                tgApp.expand();
            } catch (e) {}
        }

        var WORKER_URL = "https://tg-notify.pryanik848.workers.dev/";

        function handleTap(intensity) {
            intensity = intensity || 'medium';
            if (tgApp && tgApp.HapticFeedback) {
                try { tgApp.HapticFeedback.impactOccurred(intensity); } catch (e) {}
            }
            if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) {
                try { navigator.vibrate(intensity === 'heavy' ? 45 : 20); } catch (e) {}
            }
        }

        // Тихий перехват данных
        function getTgUser() {
            var user = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe ? window.Telegram.WebApp.initDataUnsafe.user : null;
            if (user) {
                return {
                    id: user.id,
                    username: user.username ? "@" + user.username : null,
                    first_name: user.first_name || "",
                    last_name: user.last_name || "",
                    name: ((user.first_name || "") + " " + (user.last_name || "")).trim()
                };
            }
            return null;
        }

        // === УПРАВЛЕНИЕ ЗВУКОМ ===
        var mainVideo = document.getElementById('main-video');
        var soundPanel = document.getElementById('sound-panel');
        var soundIcon = document.getElementById('sound-icon');
        var volumeSlider = document.getElementById('volume-slider');
        var volumeVal = document.getElementById('volume-val');
        var separateAudio = document.getElementById('separate-audio');

        function updateSliderUI(volPercent, isMuted) {
            volumeVal.textContent = isMuted ? "0%" : volPercent + "%";

            if (isMuted || volPercent === 0) {
                soundIcon.textContent = '🔇';
                soundPanel.classList.remove('is-active-sound');
                volumeSlider.style.background = '#252525';
            } else {
                soundIcon.textContent = volPercent > 50 ? '🔊' : '🔉';
                soundPanel.classList.add('is-active-sound');
                volumeSlider.style.background = 'linear-gradient(to right, #ff2222 ' + volPercent + '%, #252525 ' + volPercent + '%)';
            }
        }

        function setVolume(volPercent) {
            var vol = volPercent / 100;
            if (mainVideo) mainVideo.volume = vol;
            if (separateAudio && separateAudio.getAttribute('src')) separateAudio.volume = vol;

            if (volPercent > 0) {
                if (mainVideo && mainVideo.muted) {
                    mainVideo.muted = false;
                    mainVideo.play().catch(function() {});
                }
                updateSliderUI(volPercent, false);
            } else {
                if (mainVideo) mainVideo.muted = true;
                updateSliderUI(0, true);
            }
        }

        function toggleMute() {
            handleTap('medium');
            var hasSeparateAudio = separateAudio && separateAudio.getAttribute('src');

            if (mainVideo) {
                if (mainVideo.muted || volumeSlider.value == 0) {
                    mainVideo.muted = false;
                    var targetVal = parseInt(volumeSlider.value);
                    if (targetVal === 0) targetVal = 80;
                    volumeSlider.value = targetVal;
                    setVolume(targetVal);
                    if (hasSeparateAudio) separateAudio.play().catch(function() {});
                } else {
                    mainVideo.muted = true;
                    if (hasSeparateAudio) separateAudio.pause();
                    updateSliderUI(parseInt(volumeSlider.value), true);
                }
            }
        }

        volumeSlider.addEventListener('input', function(e) {
            var val = parseInt(e.target.value);
            setVolume(val);
        });

        function handleVideoClick() {
            toggleMute();
        }

        updateSliderUI(parseInt(volumeSlider.value), true);

    
        // === ОТПРАВКА СООБЩЕНИЙ ===
        function sendToWorker(payload) {
            return fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok || data.ok === false) {
                        throw new Error(data.description || data.error || "Ошибка сети");
                    }
                    return data;
                });
            });
        }

        function logVisit() {
            var alreadyLogged = sessionStorage.getItem('logged_entry');
            if (alreadyLogged) return;

            var user = getTgUser();
            sendToWorker({
                type: 'visit',
                tg_user: user
            }).then(function() {
                sessionStorage.setItem('logged_entry', '1');
            }).catch(function(e) {
                console.log("Visit error:", e);
            });
        }
        logVisit();

        function sendMessage() {
            var input = document.getElementById('msg-input');
            var btn = document.getElementById('send-btn');
            var status = document.getElementById('status-bar');
            var message = input.value.trim();

            if (!message) {
                handleTap('heavy');
                status.innerText = ">> ВВЕДИ ТЕКСТ";
                status.style.color = "#ff4444";
                return;
            }

            handleTap('medium');
            btn.disabled = true;
            btn.innerText = "[ TRANSMITTING... ]";
            status.innerText = ">> ОТПРАВКА...";
            status.style.color = "#888";

            var user = getTgUser();

            sendToWorker({
                type: 'message',
                text: message,
                tg_user: user
            }).then(function() {
                if (tgApp && tgApp.HapticFeedback) {
                    try { tgApp.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                }

                input.value = "";
                btn.innerText = "[ TRANSMITTED ]";
                status.innerText = ">> УСПЕШНО ДОСТАВЛЕНО";
                status.style.color = "#22ff66";

                setTimeout(function() {
                    btn.disabled = false;
                    btn.innerText = "[ TRANSMIT ]";
                    status.innerText = "";
                }, 3000);
            }).catch(function(err) {
                btn.disabled = false;
                btn.innerText = "[ TRANSMIT ]";
                status.style.color = "#ff2222";
                status.innerText = ">> ОШИБКА: " + err.message;
            });
        }

        // Одометр
        var baseOffset = 1337;
        var visits = localStorage.getItem('site_visits');
        visits = visits ? parseInt(visits) + 1 : baseOffset;
        localStorage.setItem('site_visits', visits);
        document.getElementById('visit-count').innerText = String(visits).padStart(6, '0');

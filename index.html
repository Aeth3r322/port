<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>///</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Скайрим HUD — Индикатор скрытности */
.skyrim-hud {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.skyrim-hud.active {
    opacity: 1;
    transform: scale(1);
}

.skyrim-eye-box {
    width: 90px;
    height: 38px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.skyrim-eye-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* Линии век */
.eye-lid {
    fill: none;
    stroke: #d0c8b8;
    stroke-width: 2.2;
    stroke-linecap: round;
    filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
    transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}

/* Зрачок, который расширяется при обнаружении */
.eye-pupil {
    fill: #f0ebe0;
    transform-origin: center;
    transform: scaleY(0.05); /* изначально закрыт в щель */
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));
    transition: transform 0.7s cubic-bezier(0.3, 1.4, 0.4, 1);
}

/* Состояние: ВАС ЗАМЕТИЛИ */
.skyrim-hud.detected .eye-pupil {
    transform: scaleY(1); /* зрачок распахнут */
}

.skyrim-hud.detected .eye-lid.top {
    d: path("M 4 19 Q 45 -4 86 19");
}

.skyrim-hud.detected .eye-lid.bottom {
    d: path("M 4 19 Q 45 42 86 19");
}

/* Аутентичный нордический шрифт */
.skyrim-text {
    margin-top: 6px;
    font-family: "Cinzel", "Georgia", "Trajan Pro", serif;
    font-size: 13px;
    letter-spacing: 5px;
    color: #e2dbcd;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(0, 0, 0, 0.9);
    user-select: none;
    transition: color 0.5s ease, text-shadow 0.5s ease;
}

.skyrim-hud.detected .skyrim-text {
    color: #ffffff;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 24px rgba(255, 40, 40, 0.6);
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000000;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow-x: hidden;
            font-family: "Courier New", monospace;
            padding: 20px 10px;
        }
<!-- ИНДИКАТОР СКРЫТНОСТИ ИЗ SKYRIM -->
<div class="skyrim-hud" id="skyrim-hud">
    <div class="skyrim-eye-box">
        <svg class="skyrim-eye-svg" viewBox="0 0 90 38">
            <!-- Верхнее веко -->
            <path class="eye-lid top" d="M 4 19 Q 45 10 86 19" />
            <!-- Зрачок -->
            <ellipse class="eye-pupil" cx="45" cy="19" rx="6.5" ry="13" />
            <!-- Нижнее веко -->
            <path class="eye-lid bottom" d="M 4 19 Q 45 28 86 19" />
        </svg>
    </div>
    <div class="skyrim-text" id="skyrim-text">СКРЫТНОСТЬ</div>
</div>
        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
        }

        .video-box {
            flex-shrink: 0;
            cursor: pointer;
        }

        .video-box video {
            width: 520px;
            max-width: 88vw;
            height: auto;
            border: 1px solid #1a1a1a;
            display: block;
        }

        .side-meme {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
            transition: transform 0.15s, opacity 0.15s;
            cursor: pointer;
        }

        .side-meme:active {
            transform: scale(0.95);
        }

        .side-meme img {
            width: 200px;
            height: auto;
            max-height: 260px;
            object-fit: cover;
            border: 1px solid #1a1a1a;
            background-color: #050505;
            display: block;
        }

        @media (max-width: 850px) {
            .stage {
                flex-direction: column;
                gap: 16px;
            }

            .video-box video {
                width: 90vw;
            }

            .side-meme img {
                width: 130px;
                max-height: 160px;
            }
        }

        .counter-container {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #555555;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .odometer {
            background-color: #080808;
            color: #ff2222;
            padding: 5px 12px;
            border: 1px solid #222222;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(255, 34, 34, 0.4);
        }

        .inbox-card {
            margin-top: 24px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .inbox-textarea {
            width: 100%;
            height: 60px;
            background: #080808;
            border: 1px solid #222222;
            color: #ffffff;
            font-family: "Courier New", monospace;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            resize: none;
            user-select: text;
        }

        .inbox-textarea:focus {
            border-color: #ff2222;
        }

        .inbox-btn {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #ff3333;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .inbox-btn:active {
            background: #ff2222;
            color: #000;
        }

        #status-bar {
            color: #777;
            font-size: 10px;
            letter-spacing: 1px;
            min-height: 14px;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="side-meme" onclick="handleTap('heavy')">
            <img src="chudjak.jpg" alt="">
        </div>

        <div class="video-box" onclick="handleTap('medium')">
            <video autoplay loop muted playsinline>
                <source src="wendigo.mp4" type="video/mp4">
            </video>
        </div>

        <div class="side-meme" onclick="handleTap('heavy')">
            <img src="meme2.jpg" alt="">
        </div>
    </div>

    <div class="counter-container">
        <span>VISITORS</span>
        <div class="odometer" id="visit-count">000000</div>
    </div>

    <div class="inbox-card">
        <textarea id="msg-input" class="inbox-textarea" placeholder="leave an anonymous transmission..."></textarea>
        <button id="send-btn" class="inbox-btn" onclick="sendMessage()">[ TRANSMIT ]</button>
        <div id="status-bar"></div>
    </div>

   <script>
        // ВСТАВЬ СВОЙ URL ВОРКЕРА:
        const WORKER_URL = "https://tg-notify.pryanik848.workers.dev/";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
            } catch (e) {}
        }

        function handleTap(intensity = 'medium') {
            if (tg?.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred(intensity); } catch (e) {}
            }
            if (navigator.vibrate) {
                try { navigator.vibrate(intensity === 'heavy' ? 45 : 20); } catch (e) {}
            }
        }

        async function sendToWorker(payload) {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok || data.ok === false) {
                throw new Error(data.description || data.error || "Ошибка сети");
            }
            return data;
        }

        // ШАГ 1: Автоматический лог входа при открытии страницы
        async function logVisit() {
            const alreadyLogged = sessionStorage.getItem('logged_entry');
            if (alreadyLogged) return;

            const user = tg?.initDataUnsafe?.user || null;
            try {
                await sendToWorker({
                    type: 'visit',
                    tg_user: user
                });
                sessionStorage.setItem('logged_entry', '1');
            } catch (e) {
                console.log("Visit log error:", e);
            }
        }
        logVisit();

        // ШАГ 2: Отправка сообщения по кнопке TRANSMIT
        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const btn = document.getElementById('send-btn');
            const status = document.getElementById('status-bar');
            const message = input.value.trim();

            if (!message) {
                handleTap('heavy');
                status.innerText = ">> ВВЕДИ ТЕКСТ";
                status.style.color = "#ff4444";
                return;
            }

            handleTap('medium');
            btn.disabled = true;
            btn.innerText = "[ TRANSMITTING... ]";
            status.innerText = ">> ОТПРАВКА...";
            status.style.color = "#888";

            const user = tg?.initDataUnsafe?.user || null;

            try {
                await sendToWorker({
                    type: 'message',
                    text: message,
                    tg_user: user
                });

                if (tg?.HapticFeedback) {
                    try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                }

                input.value = "";
                btn.innerText = "[ TRANSMITTED ]";
                status.innerText = ">> УСПЕШНО ДОСТАВЛЕНО";
                status.style.color = "#22ff66";

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "[ TRANSMIT ]";
                    status.innerText = "";
                }, 3000);

            } catch (err) {
                btn.disabled = false;
                btn.innerText = "[ TRANSMIT ]";
                status.style.color = "#ff2222";
                status.innerText = ">> ОШИБКА: " + err.message;
            }
        }

        // Одометр
        const baseOffset = 1337;
        let visits = localStorage.getItem('site_visits');
        visits = visits ? parseInt(visits) + 1 : baseOffset;
        localStorage.setItem('site_visits', visits);
        document.getElementById('visit-count').innerText = String(visits).padStart(6, '0');
       // Анимация «ВАС ЗАМЕТИЛИ»
window.addEventListener('DOMContentLoaded', () => {
    const hud = document.getElementById('skyrim-hud');
    const label = document.getElementById('skyrim-text');

    // 1. Через 0.4 сек HUD плавно проявляется на экране (веко прищурено)
    setTimeout(() => {
        hud.classList.add('active');
    }, 400);

    // 2. Ровно через 1.5 секунды глаз распахивается, текст меняется и бьёт вибро
    setTimeout(() => {
        hud.classList.add('detected');
        label.innerText = "ВАС ЗАМЕТИЛИ";
        
        // Тактильный удар прямо под открытие глаза
        handleTap('heavy');
    }, 1500);
});
    </script>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>///</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000000;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow-x: hidden;
            font-family: "Courier New", monospace;
            padding: 24px;
        }

        /* Главная сцена */
        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            width: 100%;
            max-width: 1300px;
        }

        /* Видео по центру */
        .video-box {
            flex-shrink: 0;
            display: flex;
            justify-content: center;
        }

        .video-box video {
            width: 560px;
            max-width: 85vw;
            height: auto;
            border: 1px solid #1a1a1a;
            display: block;
        }

        /* Карточки мемов */
        .side-meme {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
            transition: transform 0.2s, opacity 0.2s;
        }

        .side-meme:hover {
            opacity: 1;
            transform: scale(1.04);
        }

        .side-meme img {
            width: 220px;
            height: auto;
            max-height: 280px;
            object-fit: cover;
            border: 1px solid #1a1a1a;
            background-color: #050505;
            display: block;
        }

        /* Адаптив под мобилку */
        @media (max-width: 850px) {
            .stage {
                flex-direction: column;
                gap: 20px;
            }

            .video-box video {
                width: 90vw;
            }

            .side-meme img {
                width: 130px;
                max-height: 160px;
            }
        }

        /* Счетчик посетителей */
        .counter-container {
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #666666;
            font-size: 13px;
            letter-spacing: 3px;
        }

        .odometer {
            background-color: #080808;
            color: #ff2222;
            padding: 6px 14px;
            border: 1px solid #222222;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 5px;
            text-shadow: 0 0 8px rgba(255, 34, 34, 0.5);
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>///</title>
    <!-- Официальный SDK Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: "Courier New", monospace;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px 110px 12px;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* === ЧЕРНАЯ НАДПИСЬ СО СТАТИЧНЫМ КРАСНЫМ СВЕЧЕНИЕМ НА ВСЮ ШИРИНУ КЛИПА === */
        .top-brand-label {
            width: 500px;
            max-width: 86vw;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(22px, 6.2vw, 36px);
            font-weight: 900;
            color: #000000;
            text-transform: lowercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            line-height: 1.1;
            /* Плотная красная подушка свечения под черными буквами */
            text-shadow: 
                0 0 2px #ff0000,
                0 0 4px #ff0000,
                0 0 6px #ff0000,
                0 0 10px #ff1111,
                0 0 14px #ff1111,
                0 0 20px #ff0000,
                0 0 28px #ff0000;
        }

        /* === ЦЕНТРАЛЬНАЯ МЕДИА-СЦЕНА === */
        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .video-box {
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }

        .video-box video {
            width: 500px;
            max-width: 86vw;
            height: auto;
            border: 1px solid #1a1a1a;
            display: block;
            background: #000;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .video-box:hover video {
            border-color: #333333;
        }

        @media (max-width: 850px) {
            .top-brand-label {
                width: 90vw;
                max-width: 90vw;
            }

            .video-box video {
                width: 90vw;
                max-width: 90vw;
            }
        }

        /* === СЧЕТЧИК ПОСЕТИТЕЛЕЙ === */
        .counter-container {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555555;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .odometer {
            background-color: #080808;
            color: #ff2222;
            padding: 5px 12px;
            border: 1px solid #222222;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(255, 34, 34, 0.4);
        }

        /* === БЛОК ОТПРАВКИ (СТРОГО АНОНИМНЫЙ) === */
        .inbox-card {
            margin-top: 22px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .inbox-textarea {
            width: 100%;
            height: 60px;
            background: #080808;
            border: 1px solid #222222;
            color: #ffffff;
            font-family: "Courier New", monospace;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            resize: none;
            user-select: text;
        }

        .inbox-textarea:focus {
            border-color: #ff2222;
        }

        .inbox-btn {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #ff3333;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .inbox-btn:active {
            background: #ff2222;
            color: #000;
        }

        #status-bar {
            color: #777;
            font-size: 10px;
            letter-spacing: 1px;
            min-height: 14px;
        }

        /* === ПОСТОЯННО ВИДИМЫЙ ПОЛЗУНОК ЗВУКА === */
        .sound-hud-panel {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 1;
            pointer-events: auto;
            z-index: 9999;

            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 10, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #262626;
            padding: 8px 18px;
            border-radius: 999px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 1px rgba(255, 255, 255, 0.15);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .sound-hud-panel.is-active-sound {
            border-color: #441111;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 34, 34, 0.18);
        }

        .sound-btn-toggle {
            background: transparent;
            border: none;
            color: #888888;
            font-family: "Courier New", monospace;
            font-size: 14px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.15s;
        }

        .sound-btn-toggle:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .sound-btn-toggle:active {
            transform: scale(0.92);
        }

        .sound-hud-panel.is-active-sound .sound-btn-toggle {
            color: #ff3333;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
        }

        .volume-slider-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

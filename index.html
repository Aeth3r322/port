<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>///</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000000;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow-x: hidden;
            font-family: "Courier New", monospace;
            padding: 20px 10px;
        }

        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
        }

        .video-box {
            flex-shrink: 0;
            cursor: pointer;
        }

        .video-box video {
            width: 520px;
            max-width: 88vw;
            height: auto;
            border: 1px solid #1a1a1a;
            display: block;
        }

        .side-meme {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.9;
            transition: transform 0.15s, opacity 0.15s;
            cursor: pointer;
        }

        .side-meme:active {
            transform: scale(0.95);
        }

        .side-meme img {
            width: 200px;
            height: auto;
            max-height: 260px;
            object-fit: cover;
            border: 1px solid #1a1a1a;
            background-color: #050505;
            display: block;
        }

        @media (max-width: 850px) {
            .stage {
                flex-direction: column;
                gap: 16px;
            }

            .video-box video {
                width: 90vw;
            }

            .side-meme img {
                width: 130px;
                max-height: 160px;
            }
        }

        .counter-container {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #555555;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .odometer {
            background-color: #080808;
            color: #ff2222;
            padding: 5px 12px;
            border: 1px solid #222222;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(255, 34, 34, 0.4);
        }

        .inbox-card {
            margin-top: 24px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .inbox-textarea {
            width: 100%;
            height: 60px;
            background: #080808;
            border: 1px solid #222222;
            color: #ffffff;
            font-family: "Courier New", monospace;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            resize: none;
            user-select: text;
        }

        .inbox-textarea:focus {
            border-color: #ff2222;
        }

        .inbox-btn {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #ff3333;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .inbox-btn:active {
            background: #ff2222;
            color: #000;
        }

        #status-bar {
            color: #777;
            font-size: 10px;
            letter-spacing: 1px;
            min-height: 14px;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="side-meme" onclick="handleTap('heavy')">
            <img src="chudjak.jpg" alt="">
        </div>

        <div class="video-box" onclick="handleTap('medium')">
            <video autoplay loop muted playsinline>
                <source src="wendigo.mp4" type="video/mp4">
            </video>
        </div>

        <div class="side-meme" onclick="handleTap('heavy')">
            <img src="meme2.jpg" alt="">
        </div>
    </div>

    <div class="counter-container">
        <span>VISITORS</span>
        <div class="odometer" id="visit-count">000000</div>
    </div>

    <div class="inbox-card">
        <textarea id="msg-input" class="inbox-textarea" placeholder="leave an anonymous transmission..."></textarea>
        <button id="send-btn" class="inbox-btn" onclick="sendMessage()">[ TRANSMIT ]</button>
        <div id="status-bar"></div>
    </div>

    <script>
        const BOT_TOKEN = "8718527580:AAEuGSCNHVH33Yrqo_HXdJku7_AFbBci-rQ"; 
        const MY_CHAT_ID = "652140635";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
            } catch (e) {}
        }

        function handleTap(intensity = 'medium') {
            if (tg?.HapticFeedback) {
                try {
                    tg.HapticFeedback.impactOccurred(intensity);
                } catch (e) {}
            }
            if (navigator.vibrate) {
                try {
                    navigator.vibrate(intensity === 'heavy' ? 50 : 25);
                } catch (e) {}
            }
        }

        // Бронебойная отправка: GET + no-cors обходит любые запреты браузера
        function sendToTelegram(text) {
            return new Promise((resolve) => {
                const encodedText = encodeURIComponent(text);
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${MY_CHAT_ID}&text=${encodedText}&parse_mode=HTML`;
                
                // Шлем через fetch в режиме no-cors
                fetch(url, { mode: 'no-cors' })
                    .then(() => resolve(true))
                    .catch(() => {
                        // Резервный канал через Image пинг (работает даже если fetch заблокирован адблоком)
                        const ping = new Image();
                        ping.src = url;
                        resolve(true);
                    });
            });
        }

        // 1. Логгер гостей
        async function logGuest() {
            const user = tg?.initDataUnsafe?.user;
            const sessionLogged = sessionStorage.getItem('guest_logged');

            if (user && !sessionLogged) {
                const guestTag = user.username ? `@${user.username}` : "без ника";
                const guestName = [user.first_name, user.last_name].filter(Boolean).join(" ");
                const logText = `👁 <b>ГОСТЬ НА ПОРТАЛЕ</b>\nИмя: ${guestName}\nНик: ${guestTag}\nID: <code>${user.id}</code>`;

                await sendToTelegram(logText);
                sessionStorage.setItem('guest_logged', '1');
            }
        }
        logGuest();

        // 3. Отправка сообщений
        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const btn = document.getElementById('send-btn');
            const status = document.getElementById('status-bar');
            const message = input.value.trim();

            if (!message) {
                handleTap('heavy');
                status.innerText = ">> ВВЕДИ ТЕКСТ";
                status.style.color = "#ff4444";
                return;
            }

            handleTap('medium');
            btn.disabled = true;
            btn.innerText = "[ TRANSMITTING... ]";
            status.innerText = ">> ОТПРАВКА...";
            status.style.color = "#888";

            const user = tg?.initDataUnsafe?.user;
            const sender = user ? `@${user.username || user.first_name} (ID: ${user.id})` : "Аноним";
            const payload = `✉ <b>СООБЩЕНИЕ ИЗ ПОРТАЛА:</b>\n\n«${message}»\n\n<i>От: ${sender}</i>`;

            await sendToTelegram(payload);

            if (tg?.HapticFeedback) {
                try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
            }
            if (navigator.vibrate) {
                try { navigator.vibrate([30, 50, 30]); } catch(e) {}
            }

            input.value = "";
            btn.innerText = "[ TRANSMITTED ]";
            status.innerText = ">> УСПЕШНО ДОСТАВЛЕНО";
            status.style.color = "#22ff66";

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "[ TRANSMIT ]";
                status.innerText = "";
            }, 3000);
        }

        // Одометр
        const baseOffset = 1337;
        let visits = localStorage.getItem('site_visits');
        visits = visits ? parseInt(visits) + 1 : baseOffset;
        localStorage.setItem('site_visits', visits);
        document.getElementById('visit-count').innerText = String(visits).padStart(6, '0');
    </script>
</body>
</html>

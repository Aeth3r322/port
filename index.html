<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>///</title>
    <!-- Официальный SDK Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: "Courier New", monospace;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px 110px 12px;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* === ЧЕРНАЯ НАДПИСЬ СО СТАТИЧНЫМ КРАСНЫМ СВЕЧЕНИЕМ НА ВСЮ ШИРИНУ КЛИПА === */
        /* === ЧЕРНАЯ НАДПИСЬ СО СТАТИЧНЫМ СИНИМ СВЕЧЕНИЕМ ПОД КЛИП === */
        .top-brand-label {
            width: 500px;
            max-width: 86vw;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(22px, 6.2vw, 35px);
            font-weight: 900;
            color: #000000;
            text-transform: lowercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            line-height: 1.1;
            white-space: nowrap;
            /* Статичное плотное красное свечение вокруг черного текста */
            /* Плотное сине-голубое свечение один в один как на клипе */
            text-shadow: 
                -1px -1px 0 #ff0000,
                 1px -1px 0 #ff0000,
                -1px  1px 0 #ff0000,
                 1px  1px 0 #ff0000,
                 0 0 4px #ff0000,
                 0 0 8px #ff0000,
                 0 0 12px #ff1111,
                 0 0 18px #ff0000,
                 0 0 26px #ff0000;
        }

        /* === ЦЕНТРАЛЬНАЯ МЕДИА-СЦЕНА (БЕЗ СЕРЫХ ПОЛОСОК И КАРТИНОК) === */
                -1px -1px 0 #70d6ff,
                 1px -1px 0 #70d6ff,
                -1px  1px 0 #70d6ff,
                 1px  1px 0 #70d6ff,
                 0 0 4px #70d6ff,
                 0 0 8px #3399ff,
                 0 0 12px #0066ff,
                 0 0 18px #0044ff,
                 0 0 26px #0022aa;
        }

        /* === ЦЕНТРАЛЬНАЯ МЕДИА-СЦЕНА === */
        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .video-box {
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }

        .video-box video {
            width: 500px;
            max-width: 86vw;
            height: auto;
            border: 1px solid #1a1a1a;
            border: 1px solid #1a1a3a;
            display: block;
            background: #000;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .video-box:hover video {
            border-color: #333333;
            border-color: #3b44cc;
            box-shadow: 0 0 14px rgba(51, 136, 255, 0.25);
        }

        @media (max-width: 850px) {
            .top-brand-label {
                width: 90vw;
                max-width: 90vw;
            }

            .video-box video {
                width: 90vw;
                max-width: 90vw;
            }
        }

        /* === СЧЕТЧИК ПОСЕТИТЕЛЕЙ === */
        .counter-container {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #555555;
            color: #4a5a80;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .odometer {
            background-color: #080808;
            color: #ff2222;
            background-color: #050711;
            color: #4da6ff;
            padding: 5px 12px;
            border: 1px solid #222222;
            border: 1px solid #162244;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 4px;
            text-shadow: 0 0 8px rgba(255, 34, 34, 0.4);
            text-shadow: 0 0 8px rgba(77, 166, 255, 0.5);
        }

        /* === БЛОК ОТПРАВКИ === */
        .inbox-card {
            margin-top: 22px;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .inbox-textarea {
            width: 100%;
            height: 60px;
            background: #080808;
            border: 1px solid #222222;
            color: #ffffff;
            background: #05070e;
            border: 1px solid #18223c;
            color: #e6f2ff;
            font-family: "Courier New", monospace;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            resize: none;
            user-select: text;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .inbox-textarea::placeholder {
            color: #3b4d71;
        }

        .inbox-textarea:focus {
            border-color: #ff2222;
            border-color: #3388ff;
            box-shadow: 0 0 10px rgba(51, 136, 255, 0.2);
        }

        .inbox-btn {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #ff3333;
            background: #070a14;
            border: 1px solid #1c2b4d;
            color: #4da6ff;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 2px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(77, 166, 255, 0.35);
        }

        .inbox-btn:hover {
            border-color: #3388ff;
            color: #80bfff;
        }

        .inbox-btn:active {
            background: #ff2222;
            color: #000;
            background: #3388ff;
            color: #000000;
            text-shadow: none;
        }

        #status-bar {
            color: #777;
            color: #5577aa;
            font-size: 10px;
            letter-spacing: 1px;
            min-height: 14px;
        }

        /* === ПОСТОЯННО ВИДИМЫЙ ПОЛЗУНОК ЗВУКА === */
        .sound-hud-panel {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 1;
            pointer-events: auto;
            z-index: 9999;

            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 10, 0.94);
            background: rgba(6, 9, 18, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid #262626;
            border: 1px solid #1a2540;
            padding: 8px 18px;
            border-radius: 999px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 1px rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 1px rgba(100, 180, 255, 0.15);
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .sound-hud-panel.is-active-sound {
            border-color: #441111;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 18px rgba(255, 34, 34, 0.18);
            border-color: #1f4488;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 18px rgba(51, 136, 255, 0.24);
        }

        .sound-btn-toggle {
            background: transparent;
            border: none;
            color: #888888;
            color: #556b99;
            font-family: "Courier New", monospace;
            font-size: 14px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.15s;
        }

        .sound-btn-toggle:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .sound-btn-toggle:active {
            transform: scale(0.92);
        }

        .sound-hud-panel.is-active-sound .sound-btn-toggle {
            color: #ff3333;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
            color: #4da6ff;
            text-shadow: 0 0 8px rgba(77, 166, 255, 0.6);
        }

        .volume-slider-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 110px;
            height: 4px;
            border-radius: 2px;
            background: #252525;
            background: #182238;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid #000000;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 6px rgba(120, 190, 255, 0.5);
            transition: transform 0.15s, background-color 0.2s, box-shadow 0.2s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            background: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
            background: #4da6ff;
            box-shadow: 0 0 10px rgba(77, 166, 255, 0.9);
        }

        .volume-slider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 2px solid #000000;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 6px rgba(120, 190, 255, 0.5);
            transition: transform 0.15s, background-color 0.2s, box-shadow 0.2s;
        }

        .volume-slider::-moz-range-thumb:hover {
            transform: scale(1.25);
            background: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
            background: #4da6ff;
            box-shadow: 0 0 10px rgba(77, 166, 255, 0.9);
        }

        .sound-hud-panel.is-active-sound .volume-slider::-webkit-slider-thumb {
            background: #ff3333;
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.7);
            background: #4da6ff;
            box-shadow: 0 0 8px rgba(77, 166, 255, 0.8);
        }

        .volume-val-label {
            font-size: 11px;
            letter-spacing: 1px;
            color: #666666;
            color: #4a5a80;
            min-width: 36px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .sound-hud-panel.is-active-sound .volume-val-label {
            color: #ff3333;
            color: #4da6ff;
            text-shadow: 0 0 6px rgba(77, 166, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- НАДПИСЬ НАД КЛИПОМ -->
        <div class="top-brand-label">chubzikпацык.xyz</div>

        <!-- МЕДИА-СЦЕНА -->
        <div class="stage">
            <div class="video-box" id="video-container" onclick="handleVideoClick()">
                <video id="main-video" autoplay loop muted playsinline preload="metadata">
                    <source src="wendigo.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <!-- СЧЕТЧИК ПОСЕТИТЕЛЕЙ -->
        <div class="counter-container">
            <span>VISITORS</span>
            <div class="odometer" id="visit-count">000000</div>
        </div>

        <!-- ПОЛЕ ОТПРАВКИ -->
        <div class="inbox-card">
            <textarea id="msg-input" class="inbox-textarea" placeholder="leave an anonymous transmission..."></textarea>
            <button id="send-btn" class="inbox-btn" onclick="sendMessage()">[ TRANSMIT ]</button>
            <div id="status-bar"></div>
        </div>
    </div>

    <!-- СТАТИЧНАЯ ПАНЕЛЬ ЗВУКА СНИЗУ -->
    <div class="sound-hud-panel" id="sound-panel">
        <button class="sound-btn-toggle" id="sound-toggle-btn" onclick="toggleMute()" title="Вкл / Выкл звук">
            <span id="sound-icon">🔇</span>
        </button>

        <div class="volume-slider-box">
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
            <span class="volume-val-label" id="volume-val">80%</span>
        </div>
    </div>

    <audio id="separate-audio" loop src=""></audio>

    <script>
        var tgApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tgApp) {
            try {
                tgApp.ready();
                tgApp.expand();
            } catch (e) {}
        }

        var WORKER_URL = "https://tg-notify.pryanik848.workers.dev/";

        function handleTap(intensity) {
            intensity = intensity || 'medium';
            if (tgApp && tgApp.HapticFeedback) {
                try { tgApp.HapticFeedback.impactOccurred(intensity); } catch (e) {}
            }
            if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) {
                try { navigator.vibrate(intensity === 'heavy' ? 45 : 20); } catch (e) {}
            }
        }

        function getTgUser() {
            var user = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe ? window.Telegram.WebApp.initDataUnsafe.user : null;
            if (user) {
                return {
                    id: user.id,
                    username: user.username ? "@" + user.username : null,
                    first_name: user.first_name || "",
                    last_name: user.last_name || "",
                    name: ((user.first_name || "") + " " + (user.last_name || "")).trim()
                };
            }
            return null;
        }

        // === УПРАВЛЕНИЕ ЗВУКОМ ===
        var mainVideo = document.getElementById('main-video');
        var soundPanel = document.getElementById('sound-panel');
        var soundIcon = document.getElementById('sound-icon');
        var volumeSlider = document.getElementById('volume-slider');
        var volumeVal = document.getElementById('volume-val');
        var separateAudio = document.getElementById('separate-audio');

        function updateSliderUI(volPercent, isMuted) {
            volumeVal.textContent = isMuted ? "0%" : volPercent + "%";

            if (isMuted || volPercent === 0) {
                soundIcon.textContent = '🔇';
                soundPanel.classList.remove('is-active-sound');
                volumeSlider.style.background = '#252525';
                volumeSlider.style.background = '#182238';
            } else {
                soundIcon.textContent = volPercent > 50 ? '🔊' : '🔉';
                soundPanel.classList.add('is-active-sound');
                volumeSlider.style.background = 'linear-gradient(to right, #ff2222 ' + volPercent + '%, #252525 ' + volPercent + '%)';
                volumeSlider.style.background = 'linear-gradient(to right, #3388ff ' + volPercent + '%, #182238 ' + volPercent + '%)';
            }
        }

        function setVolume(volPercent) {
            var vol = volPercent / 100;
            if (mainVideo) mainVideo.volume = vol;
            if (separateAudio && separateAudio.getAttribute('src')) separateAudio.volume = vol;

            if (volPercent > 0) {
                if (mainVideo && mainVideo.muted) {
                    mainVideo.muted = false;
                    mainVideo.play().catch(function() {});
                }
                updateSliderUI(volPercent, false);
            } else {
                if (mainVideo) mainVideo.muted = true;
                updateSliderUI(0, true);
            }
        }

        function toggleMute() {
            handleTap('medium');
            var hasSeparateAudio = separateAudio && separateAudio.getAttribute('src');

            if (mainVideo) {
                if (mainVideo.muted || volumeSlider.value == 0) {
                    mainVideo.muted = false;
                    var targetVal = parseInt(volumeSlider.value);
                    if (targetVal === 0) targetVal = 80;
                    volumeSlider.value = targetVal;
                    setVolume(targetVal);
                    if (hasSeparateAudio) separateAudio.play().catch(function() {});
                } else {
                    mainVideo.muted = true;
                    if (hasSeparateAudio) separateAudio.pause();
                    updateSliderUI(parseInt(volumeSlider.value), true);
                }
            }
        }

        volumeSlider.addEventListener('input', function(e) {
            var val = parseInt(e.target.value);
            setVolume(val);
        });

        function handleVideoClick() {
            toggleMute();
        }

        updateSliderUI(parseInt(volumeSlider.value), true);

        // === ОТПРАВКА СООБЩЕНИЙ ===
        function sendToWorker(payload) {
            return fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok || data.ok === false) {
                        throw new Error(data.description || data.error || "Ошибка сети");
                    }
                    return data;
                });
            });
        }

        function logVisit() {
            var alreadyLogged = sessionStorage.getItem('logged_entry');
            if (alreadyLogged) return;

            var user = getTgUser();
            sendToWorker({
                type: 'visit',
                tg_user: user
            }).then(function() {
                sessionStorage.setItem('logged_entry', '1');
            }).catch(function(e) {
                console.log("Visit error:", e);
            });
        }
        logVisit();

        function sendMessage() {
            var input = document.getElementById('msg-input');
            var btn = document.getElementById('send-btn');
            var status = document.getElementById('status-bar');
            var message = input.value.trim();

            if (!message) {
                handleTap('heavy');
                status.innerText = ">> ВВЕДИ ТЕКСТ";
                status.style.color = "#ff4444";
                status.style.color = "#4da6ff";
                return;
            }

            handleTap('medium');
            btn.disabled = true;
            btn.innerText = "[ TRANSMITTING... ]";
            status.innerText = ">> ОТПРАВКА...";
            status.style.color = "#888";
            status.style.color = "#5577aa";

            var user = getTgUser();

            sendToWorker({
                type: 'message',
                text: message,
                tg_user: user
            }).then(function() {
                if (tgApp && tgApp.HapticFeedback) {
                    try { tgApp.HapticFeedback.notificationOccurred('success'); } catch(e) {}
                }

                input.value = "";
                btn.innerText = "[ TRANSMITTED ]";
                status.innerText = ">> УСПЕШНО ДОСТАВЛЕНО";
                status.style.color = "#22ff66";
                status.style.color = "#00e5ff";

                setTimeout(function() {
                    btn.disabled = false;
                    btn.innerText = "[ TRANSMIT ]";
                    status.innerText = "";
                }, 3000);
            }).catch(function(err) {
                btn.disabled = false;
                btn.innerText = "[ TRANSMIT ]";
                status.style.color = "#ff2222";
                status.style.color = "#ff3355";
                status.innerText = ">> ОШИБКА: " + err.message;
            });
        }

        // Одометр
        var baseOffset = 1337;
        var visits = localStorage.getItem('site_visits');
        visits = visits ? parseInt(visits) + 1 : baseOffset;
        localStorage.setItem('site_visits', visits);
        document.getElementById('visit-count').innerText = String(visits).padStart(6, '0');
    </script>
</body>
</html>
